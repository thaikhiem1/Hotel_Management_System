spring.config.import=optional:file:${user.dir}/../.env[.properties],optional:file:${user.dir}/.env[.properties]

#APPPLICATION
spring.application.name=${APP_Name:QLKS}
server.port=${SERVER_PORT:8080}

# DATABASE
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5434/QLKS_database}
spring.datasource.username=${DB_USERNAME:QLKS_user}
spring.datasource.password=${DB_PASSWORD:QLKS_password}
spring.datasource.driver-class-name=${DB_DRIVER:org.postgresql.Driver}

#FLYWAY: Công cụ quản lý phiên bản database (DB migration)
spring.flyway.enabled=${FLYWAY_ENABLED:true}
spring.flyway.baseline-on-migrate=${FLYWAY_BASELINE_ON_MIGRATE:false}
spring.flyway.locations=${FLYWAY_LOCATIONS:classpath:db/migration}
spring.flyway.validate-on-migrate=${FLYWAY_VALIDATE_ON_MIGRATE:true}

#JPA + Hibernate : làm việc với database thông qua entities
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:none}
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.defer-datasource-initialization=${JPA_DEFER_DATASOURCE_INITIALIZATION:false}
spring.jpa.open-in-view=${JPA_OPEN_IN_VIEW:false}

# Hibernate Naming Strategy - Giữ nguyên tên table/column như trong @Table và @Column annotations
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
spring.jpa.hibernate.naming.implicit-strategy=org.hibernate.boot.model.naming.ImplicitNamingStrategyJpaCompliantImpl
